<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gordinho Promo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #030a1a; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Vídeo vertical 1080x1920, 22s. Tudo é uma função pura de t (segundos):
// window.__seek(t) desenha o quadro exato, então o render.mjs grava sem
// depender do relógio do navegador.
const W = 1080, H = 1920, DURATION = 29.9;
// Sincronia com a música (trecho a partir de 38,34s da faixa, ~112 BPM):
// batida n cai em B(n) segundos do vídeo; compasso começa quando n % 4 === 2.
// A batida forte que volta depois da pausa é B(2) = 1,61s.
const BEAT0 = 0.53, BP = 0.5401;
const B = (n) => BEAT0 + n * BP;
const C = { navy: "#030a1a", ink: "#070b14", brand: "#0ea5e9", light: "#38bdf8",
            accent: "#22d3ee", accentLight: "#67e8f9", white: "#f8fafc", muted: "#94a3b8",
            green: "#22c55e" };
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const brl = (v) => "R$ " + v.toFixed(2).replace(".", ",");
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, size, color, align = "center", weight = 900) {
  ctx.font = `${weight} ${size}px Lato, system-ui, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function glow(color, blur, fn) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fn(); ctx.restore(); }

// Título de cena com entrada de baixo pra cima.
function headline(lt, line1, line2, y = 300) {
  const a = outCubic(prog(lt, 0.05, 0.6));
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 60);
  text(line1, W / 2, y, 92, C.white);
  if (line2) { const g = ctx.createLinearGradient(200, 0, 880, 0); g.addColorStop(0, C.brand); g.addColorStop(1, C.accentLight);
    text(line2, W / 2, y + 110, 92, g); }
  ctx.restore();
}

// ---------- Fundo contínuo ----------
function background(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.4, 50, W / 2, H * 0.4, H * 0.9);
  g.addColorStop(0, "#0b1f3a"); g.addColorStop(1, C.navy);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Grade em perspectiva rolando no chão
  ctx.save(); ctx.strokeStyle = "rgba(34,211,238,0.10)"; ctx.lineWidth = 2;
  const horizon = H * 0.62;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 20, horizon); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
  for (let k = 0; k < 14; k++) { const p = ((k + t * 0.8) % 14) / 14; const y = horizon + Math.pow(p, 2.2) * (H - horizon);
    ctx.globalAlpha = p; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // Partículas flutuando
  for (let i = 0; i < 70; i++) {
    const x = rand(i) * W, sp = 20 + rand(i + 99) * 60;
    const y = (rand(i + 7) * H - t * sp) % H; const yy = y < 0 ? y + H : y;
    ctx.fillStyle = `rgba(103,232,249,${0.15 + rand(i + 3) * 0.35})`;
    ctx.beginPath(); ctx.arc(x + Math.sin(t + i) * 12, yy, 1.5 + rand(i + 5) * 3, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- Imagens da loja ----------
const ASSETS = {
  round: "gordinho-assets/logo-round.png", word: "gordinho-assets/logo-wordmark.png",
  elfbar: "gordinho-assets/banner-elfbar.jpg", ignite: "gordinho-assets/banner-ignite.jpg",
  c0: "gordinho-assets/photo-nikbar-10k.jpg", c1: "gordinho-assets/photo-galax-60k.jpg",
  c2: "gordinho-assets/photo-ignite-v400-ice.jpg", c3: "gordinho-assets/photo-ignite-v400-sweet.jpg",
};
const IMG = {};
const imagesReady = Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((ok) => {
  const im = new Image(); im.onload = ok; im.onerror = ok; im.src = src; IMG[k] = im;
})));
function img(im, x, y, w, h, r = 0) {
  if (!im || !im.complete || !im.naturalWidth) return;
  if (r) { ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.drawImage(im, x, y, w, h); ctx.restore(); }
  else ctx.drawImage(im, x, y, w, h);
}

// ---------- Cenas ----------
function sceneIntro(lt) {
  const conv = inOutCubic(prog(lt, 0, 1.5));
  for (let i = 0; i < 160; i++) {
    const ang = rand(i) * Math.PI * 2, dist = 500 + rand(i + 50) * 900;
    const r = lerp(dist, 60 + rand(i + 9) * 40, conv);
    const x = W / 2 + Math.cos(ang + conv * 2) * r, y = H * 0.42 + Math.sin(ang + conv * 2) * r;
    ctx.fillStyle = i % 3 ? C.accent : C.white; ctx.globalAlpha = (1 - prog(lt, 1.4, 1.7)) * 0.9;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const ring = prog(lt, B(2), B(2) + 0.9);
  if (ring > 0 && ring < 1) { ctx.strokeStyle = `rgba(103,232,249,${1 - ring})`; ctx.lineWidth = 10 * (1 - ring);
    ctx.beginPath(); ctx.arc(W / 2, H * 0.42, ring * 800, 0, Math.PI * 2); ctx.stroke(); }
  // Anel girando atrás da logo
  const la = prog(lt, B(2) - 0.05, B(2) + 0.3);
  ctx.save(); ctx.globalAlpha = la; ctx.translate(W / 2, H * 0.42); ctx.rotate(lt * 1.4);
  ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.setLineDash([60, 30]);
  glow(C.accent, 30, () => { ctx.beginPath(); ctx.arc(0, 0, 470, 0, Math.PI * 2); ctx.stroke(); });
  ctx.restore();
  const s = outBack(prog(lt, B(2) - 0.23, B(2) + 0.35)), float = Math.sin(lt * 2.5) * 10;
  ctx.save(); ctx.translate(W / 2, H * 0.42 + float); ctx.scale(s, s); ctx.rotate((1 - clamp(s)) * -0.5);
  glow("rgba(14,165,233,0.7)", 80, () => img(IMG.round, -430, -430, 860, 860));
  ctx.restore();
  // Clarão branco no impacto
  const fl = 1 - prog(lt, B(2), B(2) + 0.35);
  if (lt >= B(2) && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${0.4 * fl})`; ctx.fillRect(0, 0, W, H); }
  const tg = outCubic(prog(lt, B(4) - 0.1, B(4) + 0.3)); ctx.globalAlpha = tg;
  text("Os melhores pods,", W / 2, H * 0.72 + (1 - tg) * 30, 70, C.white);
  const g = ctx.createLinearGradient(250, 0, 830, 0); g.addColorStop(0, C.brand); g.addColorStop(1, C.accentLight);
  text("entregues na sua porta", W / 2, H * 0.72 + 90 + (1 - tg) * 30, 70, g);
  ctx.globalAlpha = 1;
}

function sceneElfbar(lt, dur) {
  headline(lt, "Lançamento", "Elfbar BC15K", 330);
  // Banner largo atravessando a tela, levemente inclinado
  const bh = 780, bw = bh * 3.2;
  const p = inOutCubic(prog(lt, 0.3, dur - 0.3));
  const a = outCubic(prog(lt, 0, 0.5));
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(W / 2, 1080); ctx.rotate(-0.04);
  const x = lerp(-120, -(bw - W) - 60, p) - W / 2;
  // faixas ciano estilo pincelada nas bordas
  ctx.fillStyle = C.accent;
  glow(C.accent, 40, () => { ctx.fillRect(-W, -bh / 2 - 22, W * 2, 14); ctx.fillRect(-W, bh / 2 + 8, W * 2, 14); });
  img(IMG.elfbar, x, -bh / 2, bw, bh);
  ctx.restore();
  // Selo de preço batendo no fim
  const st = outBack(prog(lt, 6 * BP - 0.2, 6 * BP + 0.2));
  if (st > 0) { ctx.save(); ctx.translate(W / 2, 1640); ctx.rotate(-0.06); ctx.scale(st, st);
    glow("#facc15", 40, () => { rr(-330, -80, 660, 160, 30); ctx.fillStyle = "#facc15"; ctx.fill(); });
    text("Só no Gordinho", 0, 4, 70, C.ink); ctx.restore(); }
}

function sceneIgnite(lt, dur) {
  // Clima vermelho do banner da Ignite
  const red = prog(lt, 0, 0.4) * (1 - prog(lt, dur - 0.35, dur));
  const rg = ctx.createRadialGradient(W / 2, 1000, 50, W / 2, 1000, 1100);
  rg.addColorStop(0, `rgba(220,38,38,${0.55 * red})`); rg.addColorStop(1, `rgba(40,0,0,${0.8 * red})`);
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  const flash = 1 - prog(lt, 0, 0.25);
  if (flash > 0) { ctx.fillStyle = `rgba(255,80,80,${0.6 * flash})`; ctx.fillRect(0, 0, W, H); }
  const a = outCubic(prog(lt, 0.05, 0.6));
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 60);
  text("Chegou o novo", W / 2, 330, 80, C.white);
  glow("#ef4444", 50, () => text("IGNITE V500", W / 2, 450, 120, "#f87171"));
  ctx.restore();
  // Banner com zoom lento + leve tremor no impacto
  const z = outBack(prog(lt, 0.1, BP + 0.05));
  const shake = (1 - prog(lt, BP, BP + 0.3)) * (lt > BP ? 1 : 0) * 14;
  const bw = 1000, bh = bw * 238 / 640, s = z * lerp(1, 1.08, prog(lt, 0.8, dur));
  ctx.save(); ctx.translate(W / 2 + Math.sin(lt * 60) * shake, 1030); ctx.scale(s, s);
  glow("rgba(239,68,68,0.8)", 90, () => img(IMG.ignite, -bw / 2, -bh / 2, bw, bh, 28));
  ctx.strokeStyle = "rgba(248,113,113,0.7)"; ctx.lineWidth = 4; rr(-bw / 2, -bh / 2, bw, bh, 28); ctx.stroke();
  ctx.restore();
  // Destaques em sequência
  ["Até 50.000 puffs", "Bobina Mesh", "Recarga USB-C"].forEach((t, i) => {
    const cp = outBack(prog(lt, (i + 2) * BP - 0.15, (i + 2) * BP + 0.25)); if (cp <= 0) return;
    ctx.save(); ctx.globalAlpha *= clamp(cp); ctx.translate(W / 2 - (1 - cp) * 200, 1370 + i * 125);
    rr(-340, -48, 680, 96, 48); ctx.fillStyle = "rgba(239,68,68,0.18)"; ctx.fill();
    ctx.strokeStyle = "rgba(248,113,113,0.6)"; ctx.lineWidth = 3; ctx.stroke();
    text(t, 0, 2, 46, C.white); ctx.restore();
  });
}

function sceneCards(lt, dur) {
  headline(lt, "Sabores pra", "todo gosto", 300);
  const names = ["Nikbar 10K", "Dinner Lady Galax 60K", "Ignite V400 Ice", "Ignite V400 Sweet"];
  const n = names.length;
  // Posição do carrossel: anda um card a cada 3 batidas e para em cima da batida
  let pos = 0;
  for (let k = 1; k < n; k++) pos += inOutCubic(prog(lt, k * 3 * BP - 0.4, k * 3 * BP));
  const cw = 640, ch = cw * 800 / 864;
  const order = [...Array(n).keys()].sort((a, b) => Math.abs(b - pos) - Math.abs(a - pos));
  const enter = outCubic(prog(lt, 0.1, 0.6));
  for (const i of order) {
    const d = i - pos, ad = Math.abs(d);
    if (ad > 2.5) continue;
    const sc = 1 - Math.min(ad, 2) * 0.22;
    ctx.save(); ctx.globalAlpha *= enter * (1 - clamp(ad - 1.5));
    ctx.translate(W / 2 + d * 430 + (1 - enter) * 600, 1000 + Math.min(ad, 2) * 40);
    ctx.rotate(d * 0.06); ctx.scale(sc, sc);
    const near = 1 - clamp(ad);
    if (near > 0) glow(`rgba(34,211,238,${0.8 * near})`, 70, () => { rr(-cw / 2, -ch / 2, cw, ch, 32); ctx.fillStyle = "#fff"; ctx.fill(); });
    img(IMG["c" + i], -cw / 2, -ch / 2, cw, ch, 32);
    if (ad > 0.05) { rr(-cw / 2, -ch / 2, cw, ch, 32); ctx.fillStyle = `rgba(3,10,26,${clamp(ad) * 0.55})`; ctx.fill(); }
    ctx.restore();
  }
  // Nome do produto em foco, trocando junto com o carrossel
  const ni = Math.round(pos), na = 1 - Math.abs(pos - ni) * 2;
  ctx.save(); ctx.globalAlpha *= enter * clamp(na);
  glow(C.brand, 30, () => text(names[ni], W / 2, 1480 + (1 - clamp(na)) * 20, 64, C.white));
  text("Vários sabores disponíveis", W / 2, 1570, 40, C.accentLight, "center", 400);
  ctx.restore();
  // Indicadores
  for (let i = 0; i < n; i++) {
    const on = 1 - clamp(Math.abs(i - pos));
    ctx.fillStyle = on > 0.5 ? C.accent : "#334155";
    rr(W / 2 - 100 + i * 52, 1700, lerp(20, 44, on), 14, 7); ctx.fill();
  }
}

function scenePix(lt) {
  headline(lt, "Pague no Pix,", "aprovado na hora");
  const cx = W / 2, cy = 1050, size = 600, n = 25, cell = size / n;
  const morph = inOutCubic(prog(lt, 4 * BP - 0.4, 4 * BP));
  const pa = outCubic(prog(lt, 0.2, 0.6));
  ctx.save(); ctx.globalAlpha = pa;
  // Moldura branca
  const fw = lerp(size + 80, 420, morph);
  rr(cx - fw / 2, cy - fw / 2, fw, fw, lerp(40, fw / 2, morph));
  ctx.fillStyle = morph < 0.5 ? C.white : C.green;
  if (morph > 0) ctx.fillStyle = `rgb(${lerp(248, 34, morph)},${lerp(250, 197, morph)},${lerp(252, 94, morph)})`;
  glow(morph > 0.5 ? C.green : C.brand, 70, () => ctx.fill());
  // Módulos do QR (finder patterns fixos + ruído determinístico), surgindo em onda diagonal
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
      const a = r - fr, b = c - fc; if (a >= 0 && a < 7 && b >= 0 && b < 7)
        return a === 0 || a === 6 || b === 0 || b === 6 || (a >= 2 && a <= 4 && b >= 2 && b <= 4) ? 1 : 0; } return -1; };
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const f = finder(r, c); const on = f === -1 ? rand(r * 31 + c * 7) > 0.52 : f === 1;
    if (!on) continue;
    const wp = prog(lt, 0.3 + (r + c) * 0.012, 0.5 + (r + c) * 0.012);
    const s = cell * wp * (1 - morph);
    if (s <= 0.5) continue;
    ctx.fillStyle = C.ink;
    ctx.fillRect(cx - size / 2 + c * cell + (cell - s) / 2, cy - size / 2 + r * cell + (cell - s) / 2, s, s);
  }
  // Linha de leitura
  const sc = prog(lt, 1.0, 3 * BP);
  if (sc > 0 && sc < 1) { const y = cy - size / 2 + Math.sin(sc * Math.PI) * size;
    ctx.fillStyle = "rgba(14,165,233,0.9)"; glow(C.brand, 30, () => ctx.fillRect(cx - size / 2 - 20, y - 4, size + 40, 8)); }
  // Check
  const ck = prog(lt, 4 * BP - 0.05, 4 * BP + 0.35);
  if (ck > 0) { ctx.strokeStyle = C.white; ctx.lineWidth = 34; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const p1 = [cx - 100, cy + 5], p2 = [cx - 25, cy + 80], p3 = [cx + 115, cy - 75];
    ctx.beginPath(); ctx.moveTo(...p1);
    const a = clamp(ck * 2), b = clamp(ck * 2 - 1);
    ctx.lineTo(lerp(p1[0], p2[0], a), lerp(p1[1], p2[1], a));
    if (b > 0) ctx.lineTo(lerp(p2[0], p3[0], b), lerp(p2[1], p3[1], b));
    ctx.stroke();
    // confete radial
    for (let i = 0; i < 40; i++) { const ang = (i / 40) * Math.PI * 2, d = 230 + outCubic(ck) * 260 * (0.6 + rand(i) * 0.6);
      ctx.fillStyle = i % 2 ? C.accent : C.green; ctx.globalAlpha = pa * (1 - prog(lt, 2.6, 3.1));
      ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, 8, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = pa * outCubic(prog(lt, 2.3, 2.7));
    text("Pagamento aprovado", cx, cy + 420, 64, C.white);
  }
  ctx.restore();
}

function sceneOutro(lt) {
  const s = outBack(prog(lt, 0.1, 0.7));
  ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.scale(s, s); ctx.rotate(-0.03 * (1 - clamp(s)));
  const ww = 960, wh = ww * 500 / 1289;
  glow("rgba(34,211,238,0.6)", 60, () => img(IMG.word, -ww / 2, -wh / 2, ww, wh));
  ctx.restore();
  const b = outBack(prog(lt, 4 * BP - 0.2, 4 * BP + 0.3));
  ctx.save(); ctx.translate(W / 2, H * 0.58); ctx.scale(b, b);
  const pulse = 1 + Math.sin(lt * 6) * 0.025 * prog(lt, 2.5, 2.8);
  ctx.scale(pulse, pulse);
  const g = ctx.createLinearGradient(-340, 0, 340, 0); g.addColorStop(0, C.brand); g.addColorStop(1, C.accent);
  glow(C.brand, 60, () => { rr(-340, -80, 680, 160, 80); ctx.fillStyle = g; ctx.fill(); });
  text("Peça pelo site", 0, 3, 68, C.white);
  ctx.restore();
  ctx.globalAlpha = outCubic(prog(lt, 2.5, 3.0));
  text("Pix  ·  Entrega na sua região  ·  Rastreio", W / 2, H * 0.68, 40, C.muted, "center", 400);
  rr(90, H * 0.84, W - 180, 170, 24); ctx.fillStyle = "rgba(15,23,42,0.85)"; ctx.fill();
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 2; ctx.stroke();
  text("Contém nicotina, substância que causa dependência.", W / 2, H * 0.84 + 58, 34, "#cbd5e1", "center", 400);
  text("Venda proibida para menores de 18 anos.", W / 2, H * 0.84 + 112, 34, "#cbd5e1", "center", 400);
  ctx.globalAlpha = 1;
}

const scenes = [
  // Toda troca de cena cai no começo de um compasso
  [0, B(10), sceneIntro], [B(10), B(18), sceneElfbar], [B(18), B(26), sceneIgnite],
  [B(26), B(38), sceneCards], [B(38), B(46), scenePix], [B(46), DURATION, sceneOutro],
];

function beatPulse(t) {
  const n = Math.floor((t - BEAT0) / BP);
  if (n < 2) return 0;
  const since = t - B(n), strong = n % 4 === 2 ? 0.022 : 0.009;
  return strong * Math.exp(-since * 9);
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  background(t);
  for (const [a, b, fn] of scenes) {
    if (t < a - 0.001 || t > b) continue;
    const lt = t - a, out = b === DURATION ? 0 : prog(t, b - 0.35, b);
    const inn = a === 0 ? 1 : prog(t, a, a + 0.3);
    ctx.save(); ctx.globalAlpha = inn * (1 - out);
    const s = 1 + out * 0.08 + (1 - inn) * -0.04 + beatPulse(t);
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
    fn(lt, b - a); ctx.restore();
  }
  const end = prog(t, DURATION - 1.2, DURATION);
  if (end > 0) { ctx.fillStyle = `rgba(3,10,26,${end})`; ctx.fillRect(0, 0, W, H); }
}

// Contrato com o render.mjs: duração, tamanho e um seek determinístico.
window.__video = { duration: DURATION, width: W, height: H };
window.__seek = (t) => draw(t);
// Canvas não dispara o download da fonte sozinho: pede os pesos explicitamente.
const fontsReady = Promise.all([document.fonts.load("900 40px Lato"), document.fonts.load("400 40px Lato")])
  .catch(() => {}).then(() => document.fonts.ready);
window.__ready = Promise.all([fontsReady, imagesReady]);

// Reprodução normal no navegador (em loop) quando não está gravando.
if (!new URLSearchParams(location.search).has("render")) {
  window.__ready.then(() => { const t0 = performance.now();
    const loop = (now) => { draw(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop); });
}
</script>
</body>
</html>
